[workspace]
resolver = "2"
members = [
  "native/core",
  "native/shaderbench",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
authors = ["MoneyMoves"]
rust-version = "1.96"

[workspace.dependencies]
anyhow = "1.0.99"
clap = { version = "4.5.47", features = ["derive"] }
image = "0.25.8"
serde = { version = "1.0.225", features = ["derive"] }
serde_json = "1.0.145"

