[workspace]
resolver = "2"
members = [
  "native/core",
  "native/plugins/dot-matrix",
  "native/plugins/eight-bit",
  "native/plugins/frame-gate",
  "native/plugins/halftone",
  "native/plugins/rgb-shift",
  "native/shaderbench",
]

[workspace.package]
version = "0.5.0"
edition = "2024"
license = "MIT"
authors = ["MoneyMoves"]
rust-version = "1.96"

[workspace.dependencies]
anyhow = "1.0.99"
clap = { version = "4.5.47", features = ["derive"] }
image = "0.25.8"
serde = { version = "1.0.225", features = ["derive"] }
serde_json = "1.0.145"
after-effects = { package = "exaecut-after-effects", version = "=0.5.0" }
premiere = { package = "exaecut-premiere", version = "=0.5.0" }
prgpu = "=0.2.0"
prgpu-build = "=0.2.0"
bytemuck = "1.23.2"
